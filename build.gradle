plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

configurations {
  mockitoAgent
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  // Docker 없이 테스트: 실제 redis-server 바이너리(mac arm64/linux 포함)를 띄움
  testImplementation('com.github.codemonstur:embedded-redis:1.4.4') {
    exclude group: 'redis.clients', module: 'jedis' // 라이브러리 내부에서 안 씀
  }
  testRuntimeOnly 'com.h2database:h2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('test') {
  useJUnitPlatform()
  // JDK 21+ 에서 Mockito 가 내는 JVM 경고 제거 (동적 에이전트 로딩 / CDS)
  jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off'
}
