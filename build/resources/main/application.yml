spring:
  # schema.sql / data.sql 은 임베디드 DB(테스트용 H2)에서만 자동 실행됨 (스프링 부트 기본값).
  # 실제 Oracle 에는 기동 때마다 DDL 이 돌지 않도록 한 번 수동으로 실행할 것
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1 # 환경에 맞게 변경 (Oracle 23ai Free 기본 서비스명)
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms # Redis 가 느리거나 죽었을 때 오래 붙잡지 말고 DB 로 넘어가도록
      connect-timeout: 500ms
      repositories:
        enabled: false # Redis 는 캐시로만 사용
  cache:
    redis:
      # 앱 밖(DB 직접 수정, 다른 시스템, 배치)에서 바뀐 상태가 반영되기까지의 최대 지연.
      # 앱 API 로 바꾼 상태는 커밋 직후 Redis 값도 바꾸므로 TTL 과 무관하게 바로 반영됨
      time-to-live: 60s

logging:
  level:
    com.example.redissample.mapper: debug # MyBatis SQL 로그. 캐시 hit 이면 안 찍힘
